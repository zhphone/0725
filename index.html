<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>iPhone 17 시뮬레이터</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation;background:radial-gradient(circle at 50% 30%,#2b2e3b,#0b0c11);font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#phone{position:relative;width:430px;height:902px;padding:14px;border-radius:72px;background:linear-gradient(145deg,#8d8f96,#3b3d44 45%,#7a7c84);box-shadow:0 30px 80px #000a,inset 0 0 0 2px #ffffff30}
#side{position:absolute;right:-5px;top:250px;width:5px;height:96px;border-radius:0 3px 3px 0;background:#6b6d75;cursor:pointer}
#screen{position:relative;width:402px;height:874px;border-radius:58px;clip-path:inset(0 round 58px);overflow:hidden;background:#000;box-shadow:0 0 0 6px #000;color:#fff}
body.m{background:#000}body.m #stage{display:block}body.m #phone{position:absolute;left:0;top:0;width:402px;padding:0;border-radius:0;background:none;box-shadow:none;transform-origin:0 0}
body.m #screen{border-radius:0;clip-path:none;box-shadow:none}
body.m #side,body.m #isl{display:none}
.layer{position:absolute;inset:0}
.wp{background-size:cover;background-position:center}
#isl{position:absolute;z-index:75;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
#sb{position:absolute;z-index:70;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 48px;font-weight:600;font-size:17px;transition:color .3s}
#sb .r{display:flex;gap:6px;align-items:center}
#screen.inapp #sb{color:#000}
#screen.incall #sb{color:#fff}
#hi{position:absolute;z-index:90;bottom:0;left:0;right:0;height:30px;cursor:pointer}
#hi::after{content:"";position:absolute;left:50%;bottom:8px;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:#fff;transition:background .3s}
#screen.inapp #hi::after{background:#000}
#screen.incall #hi::after{background:#fff}

/* 잠금화면 */
#lock{z-index:60;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
#lock.gone{transform:translateY(-102%);pointer-events:none}
#lock .wp{position:absolute;inset:0;background-image:url(lock.jpg)}
#lock .sh{position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#0000 65%,#0007)}
#ld{position:absolute;top:92px;width:100%;text-align:center;font-size:20px;font-weight:500;text-shadow:0 1px 8px #0006}
#lt{position:absolute;top:112px;width:100%;text-align:center;font-size:92px;font-weight:600;letter-spacing:-2px;text-shadow:0 2px 14px #0005}
.lb{position:absolute;bottom:50px;width:52px;height:52px;border-radius:50%;background:#2a2a2ca8;border:1px solid #ffffff22;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;place-items:center}
#lh{position:absolute;bottom:18px;width:100%;text-align:center;font-size:14px;opacity:.85}
#pc{position:absolute;inset:0;background:#0007;backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;padding-top:104px;cursor:default}
#pc.on{opacity:1;pointer-events:auto}
#pc h3{font-size:20px;font-weight:500}
#dots{display:flex;gap:20px;margin:28px 0 54px}
#dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}
#dots i.f{background:#fff}
#dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
#keys{display:grid;grid-template-columns:repeat(3,78px);gap:18px 26px}
.k{width:78px;height:78px;border-radius:50%;background:#ffffff2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;line-height:1;transition:background .15s}
.k:active{background:#ffffff80}
.k small{font-size:10px;letter-spacing:2px;margin-top:3px;height:10px}
#pcx{position:absolute;right:50px;bottom:58px;font-size:17px}

/* 홈 */
#home{z-index:10}
#home .wp{position:absolute;inset:0;background-image:url(home-new.jpg)}
#grid{position:absolute;top:78px;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;padding:0 17px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-shadow:0 1px 5px #000b,0 0 2px #0007;cursor:pointer}
.ic i{position:relative;display:block;width:60px;height:60px;transition:transform .1s}
.ic i img{width:60px;height:60px;display:block;pointer-events:none}
.ic:active i{transform:scale(.9)}
#dock{position:absolute;bottom:22px;left:14px;right:14px;height:100px;border-radius:38px;background:#ffffff30;border:1px solid #ffffff22;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:flex;justify-content:center;gap:26px;align-items:center}
#dock .ic span{display:none}
.bd{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font:600 13px/22px system-ui;text-align:center;padding:0 6px}

/* 앱 공통 */
.app{position:absolute;inset:0;z-index:20;background:#fff;color:#000;overflow:hidden;border-radius:56px;opacity:0;transform:scale(.12);pointer-events:none;transition:transform .4s cubic-bezier(.3,.85,.3,1),opacity .25s,border-radius .4s}
.app.open{opacity:1;transform:scale(1);border-radius:0;pointer-events:auto}
.v{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:54px;background:#fff}
.lh{padding:14px 20px 8px;font-size:34px;font-weight:700}
.rows{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:12px;padding:10px 20px;position:relative;cursor:pointer}
.row>div{flex:1;min-width:0;border-bottom:.5px solid #0002;padding-bottom:10px}
.row p{font-size:14.5px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row small{position:absolute;right:20px;top:14px;color:#999;font-size:13px}
.row u{position:absolute;right:20px;bottom:20px;min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;text-decoration:none;font-size:12px;line-height:20px;text-align:center}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(#a7aab5,#7d808c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:600;flex:none;margin-bottom:10px}
.th{transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);box-shadow:-8px 0 20px #0002}
.app.t .th{transform:none}
.thh{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:.5px solid #0002;background:#f7f7f7}
.bk{font-size:34px;line-height:26px;color:#0a84ff;padding-bottom:4px}
.msgs{flex:1;overflow:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.r{display:flex;gap:8px;max-width:82%;align-items:flex-start}
.r.me{align-self:flex-end}
.r .av{width:36px;height:36px;font-size:15px;margin:0}
.n{font-size:12px;color:#444;display:block;margin-bottom:3px}
.b{padding:9px 14px;border-radius:19px;font-size:16.5px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.sms .me .b{background:#0a84ff;color:#fff}.sms .you .b{background:#e9e9eb}
.sms .row .av{background:linear-gradient(#a7aab5,#7d808c)}
.typ{letter-spacing:3px;color:#888}
.bar{display:flex;gap:8px;padding:8px 12px 34px;background:#f7f7f7;border-top:.5px solid #0002}
.bar input{flex:1;height:38px;border:1px solid #ccc;border-radius:19px;padding:0 14px;font-size:16px;outline:0;background:#fff;user-select:text;-webkit-user-select:text}
.bar button{width:38px;height:38px;border-radius:50%;background:#0a84ff;color:#fff;font-size:20px;font-weight:700}
.kko .lh{font-size:26px}
.kko .row .av{border-radius:18px;background:linear-gradient(#cfd6e0,#9aa5b6)}
.kko .thh{background:#b2c7d9;border:0}.kko .bk{color:#222}
.kko .msgs{background:#b2c7d9}
.kko .you .b{background:#fff;border-radius:4px 16px 16px 16px}
.kko .me .b{background:#fee500;border-radius:16px 4px 16px 16px}
.kko .bar{background:#fff}.kko .bar button{background:#fee500;color:#222}.kko .bar input{border-radius:8px}

/* 전화 */
.cb{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#34c759;color:#fff}
.cb.red{background:#ff3b30}
#call{z-index:65;background:linear-gradient(#3a4252,#161a22);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;padding-top:120px;color:#fff}
#call.on{opacity:1;pointer-events:auto}
#cn{font-size:36px;font-weight:500;margin-top:14px}
#cs{font-size:18px;opacity:.7;margin-top:6px}
#cav{width:96px;height:96px;font-size:42px;margin:0}
#cb{position:absolute;bottom:90px;width:100%;display:flex;flex-direction:column;align-items:center;gap:44px}
.cr{display:flex;gap:52px}
.cs{width:72px;height:72px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:26px}
.cs.on{background:#fff;color:#000}
.cl{text-align:center;font-size:13px;margin-top:6px}

/* 알림, 토스트 */
#nt{position:absolute;z-index:80;top:56px;left:8px;right:8px;padding:12px 14px;border-radius:26px;background:#f2f2f2ee;backdrop-filter:blur(20px);color:#000;display:flex;gap:12px;align-items:center;transform:translateY(-260px);opacity:0;transition:transform .45s cubic-bezier(.3,.9,.3,1),opacity .2s;box-shadow:0 8px 24px #0004;cursor:pointer}
#nt.on{transform:none;opacity:1}
#nt i{width:38px;height:38px;display:block;font-style:normal;font-size:24px;flex:none}#nt i img{width:38px;height:38px;border-radius:9px;display:block}
#nt b{font-size:15px}#nt p{font-size:14px;color:#333;margin-top:1px}
#toast{position:absolute;z-index:85;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:20px;background:#000b;font-size:14px;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}

#screen.inview #sb{color:#fff}#screen.inview #hi::after{background:#fff}
.pg{padding-top:0}
.pgh{padding:58px 20px 8px;display:flex;align-items:baseline;justify-content:space-between;background:#fff}
.pgh b{font-size:34px;font-weight:700}.pgh small{font-size:14px;color:#8e8e93}
.pgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start;padding-bottom:120px}
.pi{aspect-ratio:1;background-image:url(thumbs.jpg);background-color:#e5e5ea;cursor:pointer}
.pi:active{opacity:.7}
.pseg{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;padding:4px;border-radius:24px;background:#f2f2f7e6;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 14px #0003;font-size:14px;color:#555}
.pseg span,.pseg b{padding:8px 15px;border-radius:20px;font-weight:500;white-space:nowrap}
.pseg b{background:#fff;color:#000;box-shadow:0 1px 4px #0002}
.pv{position:absolute;inset:0;background:#000;color:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.app.t .pv{opacity:1;pointer-events:auto}
.pvs{position:absolute;inset:0;overflow:hidden;touch-action:pan-y;cursor:grab}
.pvtr{display:flex;height:100%;will-change:transform}
.sl{width:402px;height:100%;flex:none;display:grid;place-items:center}
.sl img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.pvh,.pvf{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;transition:opacity .2s;background:#000a;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pvh{top:0;padding:54px 14px 10px}.pvf{bottom:0;padding:10px 30px 36px;font-size:24px}
.pvh button{font-size:17px;color:#0a84ff;width:90px;text-align:left}.pvh i{width:90px}
.pvt{font-size:15px;font-weight:600}
.pv.bare .pvh,.pv.bare .pvf{opacity:0;pointer-events:none}
.pvf button.on{color:#ff3b30}

#sb .bt{fill:#000}#screen.inapp #sb .bt{fill:#fff}#screen.incall #sb .bt,#screen.inview #sb .bt{fill:#000}
#sb .r{gap:7px}
#phoneapp{background:#fff}
.pkv{position:absolute;inset:0;display:none;flex-direction:column;padding-top:54px}.pkv.on{display:flex}
#pknum{flex:1;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:16px}
#pkn{font-size:40px;font-weight:300;height:48px;letter-spacing:1px}
#pkadd{font-size:15px;color:#2f7df6;height:20px;visibility:hidden}
.pkg,.pkc{display:grid;grid-template-columns:repeat(3,var(--kb,80px));justify-content:center}
.pkg{gap:var(--kg,16px) 20px}
.pkk{width:var(--kb,80px);height:var(--kb,80px);border-radius:50%;background:radial-gradient(circle at 50% 22%,#fff,#f2f2f3);border:1px solid #d3d3d7;box-shadow:0 10px 18px -8px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:300;line-height:1;color:#000;transition:background .12s}
.pkk:active{background:#dcdce0}
.pkk small{font-size:11px;font-weight:700;letter-spacing:3px;margin-top:2px;height:11px;line-height:11px}
.pkc{gap:20px;margin:22px 0 112px;align-items:center;justify-items:center}
.pkcall{grid-column:2;width:var(--kb,80px);height:var(--kb,80px);border-radius:50%;background:linear-gradient(#74d77c,#5cc765);border:1px solid #8fe096;display:grid;place-items:center;box-shadow:0 8px 16px -6px #34c75988}
.pkdel{font-size:28px;color:#8e8e93;visibility:hidden}
.ptabs{position:absolute;z-index:5;left:18px;right:18px;bottom:20px;height:58px;border-radius:30px;background:#fafafaea;border:1px solid #0000001c;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 24px -6px #0003;display:flex;padding:4px}
.pt{flex:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:#000;cursor:pointer}
.pt svg{width:26px;height:24px}.pt.on{background:#e9e9ec;color:#2f7df6}
.rch{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0}
.rbtn{height:40px;min-width:40px;padding:0 18px;border-radius:20px;background:#fafafa;border:1px solid #d8d8dc;box-shadow:0 6px 14px -6px #0003;display:grid;place-items:center;font-size:16px;color:#000}
.rseg{display:flex;padding:3px;border-radius:24px;border:1px solid #d8d8dc;box-shadow:0 6px 14px -6px #0003;font-size:16px}
.rseg span{padding:9px 18px;border-radius:21px;cursor:pointer}.rseg span.on{background:#e9e9ec}
.rtitle{font-size:34px;font-weight:700;padding:12px 18px 6px;color:#000}
#rlist{flex:1;overflow:auto;padding-bottom:110px}
.rr{display:flex;align-items:center;gap:12px;padding-left:18px;height:67px;cursor:pointer;color:#000}
.rr:active{background:#f0f0f3}
.rav{width:40px;height:40px;border-radius:50%;background:linear-gradient(#9aa6dc,#6b72b1);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:600;font-style:normal;flex:none}
.rav.gen{background:linear-gradient(#bcbec8,#9b9da9)}
.rm{flex:1;min-width:0;height:100%;display:flex;align-items:center;border-bottom:.5px solid #cfcfd4;padding-right:16px}
.rtx{flex:1;min-width:0}.rtx b{display:block;font-size:17px;font-weight:500}
.rtx p{font-size:14.5px;color:#8e8e93;display:flex;align-items:center;gap:4px;margin-top:2px}
.rtm{font-size:15px;color:#8e8e93;margin:0 10px 0 8px;white-space:nowrap}
.ri{width:36px;height:36px;border-radius:50%;background:#f0f0f3;color:#2f7df6;display:grid;place-items:center;font:italic 600 19px Georgia,serif}
.rr.miss b{color:#ff3b30}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="phone"><div id="side" title="잠금"></div>
<div id="screen">
  <div id="isl"></div>
  <div id="sb"><span id="st">9:41</span><span class="r">
    <svg width="20" height="13" viewBox="0 0 20 13" fill="currentColor"><rect y="8" width="3.6" height="5" rx="1.8"/><rect x="5.5" y="5.5" width="3.6" height="7.5" rx="1.8"/><rect x="11" y="2.8" width="3.6" height="10.2" rx="1.8"/><rect x="16.4" width="3.6" height="13" rx="1.8"/></svg>
    <svg width="19" height="14" viewBox="0 0 19 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 4.1A11.7 11.7 0 0 1 17 4.1"/><path d="M4.6 7.2A7.6 7.6 0 0 1 14.4 7.2"/><path d="M9.5 12.8L7 10.2A3.8 3.8 0 0 1 12 10.2z" fill="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <svg width="31" height="14" viewBox="0 0 31 14"><clipPath id="bc"><rect width="27" height="14" rx="4.6"/></clipPath><rect width="27" height="14" rx="4.6" fill="currentColor" opacity=".3"/><rect clip-path="url(#bc)" width="23.4" height="14" fill="currentColor"/><path d="M28.6 4.8v4.4c1.1-.4 1.8-1.3 1.8-2.2s-.7-1.8-1.8-2.2z" fill="currentColor" opacity=".4"/><text x="11.7" y="11" text-anchor="middle" font-size="10.5" font-weight="700" class="bt" font-family="-apple-system,system-ui,sans-serif">87</text></svg>
  </span></div>

  <div id="home" class="layer"><div class="wp"></div><div id="grid"></div><div id="dock"></div></div>

  <div id="call" class="layer"><i class="av" id="cav"></i><div id="cn"></div><div id="cs"></div><div id="cb"></div></div>

  <div id="lock" class="layer">
    <div class="wp"></div><div class="sh"></div>
    <div id="ld"></div><div id="lt"></div>
    <div class="lb" style="left:48px"><svg width="22" height="24" viewBox="0 0 22 24"><path fill="#fff" d="M5 .5h12a.8.8 0 0 1 .8.8v2.6L15.2 7v13.2a3 3 0 0 1-3 3h-2.4a3 3 0 0 1-3-3V7L4.2 3.900V1.300A.8.8 0 0 1 5 .5z"/><rect x="9.900" y="9.800" width="2.200" height="4" rx="1.100" fill="#2a2a2c"/></svg></div><div class="lb" style="right:48px"><svg width="27" height="22" viewBox="0 0 27 22"><path fill="#fff" d="M9.500 1h8l1.700 2.600H23a3 3 0 0 1 3 3V18a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V6.600a3 3 0 0 1 3-3h3.800z"/><circle cx="13.500" cy="12" r="5" fill="#2a2a2c"/><circle cx="13.500" cy="12" r="3.400" fill="#fff"/><circle cx="21.500" cy="7" r="1" fill="#2a2a2c"/></svg></div>
    <div id="lh">화면을 눌러 잠금 해제</div>
    <div id="pc"><h3>암호 입력</h3><div id="dots"><i></i><i></i><i></i><i></i></div><div id="keys"></div><button id="pcx">취소</button></div>
  </div>

  <div id="nt"></div><div id="toast"></div><div id="hi"></div>

const $=s=>document.querySelector(s),scr=$('#screen'),ph=$('#phone');
const PASS='0323';
let S=1,locked=true,curApp=null,pin='',callT=null,seeded=false;

/* 화면 크기에 맞춰 폰 크기 조절 (모바일은 화면을 가득 채움) */
function fit(){
  const vv=window.visualViewport,w=Math.round(vv?vv.width:innerWidth),h=Math.round(vv?vv.height:innerHeight),m=w<=500;
  document.body.classList.toggle('m',m);
  let sh=874;
  if(m){S=w/402;sh=h/S;ph.style.height=sh+'px';scr.style.height=sh+'px'}
  else{S=Math.min((w-30)/430,(h-30)/902,1.1);ph.style.height='';scr.style.height=''}
  ph.style.transform=`scale(${S})`;
  scr.style.setProperty('--kb',sh<780?'68px':'80px');scr.style.setProperty('--kg',sh<780?'12px':'16px');
}
addEventListener('resize',fit);window.visualViewport&&visualViewport.addEventListener('resize',fit);fit();

/* 시계 */
function tick(){
  const d=new Date(),t=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  $('#st').textContent=t;$('#lt').textContent=t;
  $('#ld').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
}
tick();setInterval(tick,10000);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}

/* 잠금화면 / 암호 */
const keys=$('#keys'),dots=[...document.querySelectorAll('#dots i')];
const subs={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
[1,2,3,4,5,6,7,8,9,'',0,''].forEach(n=>{
  const b=document.createElement('button');
  if(n===''){keys.appendChild(document.createElement('span'));return}
  b.className='k';b.innerHTML=`${n}<small>${subs[n]||''}</small>`;b.onclick=e=>{e.stopPropagation();press(String(n))};keys.appendChild(b);
});
function showPC(){pin='';drawDots();$('#pc').classList.add('on')}
function hidePC(){$('#pc').classList.remove('on')}
function drawDots(){dots.forEach((d,i)=>d.classList.toggle('f',i<pin.length))}
function press(n){
  if(pin.length>=4)return;
  pin+=n;drawDots();

  const start=()=>{
    answered=true;let n=0;$('#cs').textContent='00:00';
    callT=setInterval(()=>{n++;$('#cs').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')},1000);
    cb.innerHTML=`<div class="cr">${['🔇|음소거','⌨️|키패드','🔊|스피커'].map(x=>`<div><div class="cs">${x.split('|')[0]}</div><div class="cl">${x.split('|')[1]}</div></div>`).join('')}</div><button class="cb red" style="transform:rotate(135deg)">📞</button>`;
    cb.querySelectorAll('.cs').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    cb.querySelector('.cb').onclick=end;
  };
  if(incoming){
    $('#cs').textContent='휴대전화 수신 중…';
    cb.innerHTML=`<div class="cr" style="gap:120px"><div><button class="cb red" style="transform:rotate(135deg)">📞</button><div class="cl">거절</div></div><div><button class="cb">📞</button><div class="cl">수락</div></div></div>`;
    const [no,yes]=cb.querySelectorAll('.cb');no.onclick=end;yes.onclick=start;
  }else{
    $('#cs').textContent='전화 거는 중…';
    cb.innerHTML=`<button class="cb red" style="transform:rotate(135deg)">📞</button>`;cb.querySelector('.cb').onclick=end;
    callT=setTimeout(start,1800);
  }
  scr.classList.add('incall');c.classList.add('on');
  if(incoming)hideNt();
}
/* 접속 25초 뒤 宝贝에게서 전화 (잠금화면 위에서도 울림) */
function ring(){if($('#call').classList.contains('on'))return setTimeout(ring,4000);callScreen('宝贝','휴대전화',true)}
setTimeout(ring,25000);
</script>
