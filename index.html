<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iPhone 17 시뮬레이터</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2b2e3b,#0b0c11);font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#phone{position:relative;width:430px;height:902px;padding:14px;border-radius:72px;background:linear-gradient(145deg,#8d8f96,#3b3d44 45%,#7a7c84);box-shadow:0 30px 80px #000a,inset 0 0 0 2px #ffffff30}
#side{position:absolute;right:-5px;top:250px;width:5px;height:96px;border-radius:0 3px 3px 0;background:#6b6d75;cursor:pointer}
#screen{position:relative;width:402px;height:874px;border-radius:58px;overflow:hidden;background:#000;box-shadow:0 0 0 6px #000;color:#fff}
body.m #phone{width:402px;height:874px;padding:0;border-radius:0;background:none;box-shadow:none}
body.m #screen{border-radius:0;box-shadow:none}
body.m #side,body.m #isl{display:none}
.layer{position:absolute;inset:0}
.wp{background-size:cover;background-position:center}
#isl{position:absolute;z-index:75;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
#sb{position:absolute;z-index:70;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 48px;font-weight:600;font-size:17px;transition:color .3s}
#sb .r{display:flex;gap:6px;align-items:center}
#screen.inapp #sb{color:#000}
#screen.incall #sb{color:#fff}
#hi{position:absolute;z-index:90;bottom:0;left:0;right:0;height:30px;cursor:pointer}
#hi::after{content:"";position:absolute;left:50%;bottom:8px;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:#fff;transition:background .3s}
#screen.inapp #hi::after{background:#000}
#screen.incall #hi::after{background:#fff}

/* 잠금화면 */
#lock{z-index:60;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
#lock.gone{transform:translateY(-102%);pointer-events:none}
#lock .wp{position:absolute;inset:0;background-image:url(lock.jpg)}
#lock .sh{position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#0000 65%,#0007)}
#ld{position:absolute;top:92px;width:100%;text-align:center;font-size:20px;font-weight:500;text-shadow:0 1px 8px #0006}
#lt{position:absolute;top:112px;width:100%;text-align:center;font-size:92px;font-weight:600;letter-spacing:-2px;text-shadow:0 2px 14px #0005}
.lb{position:absolute;bottom:60px;width:50px;height:50px;border-radius:50%;background:#0006;backdrop-filter:blur(20px);display:grid;place-items:center;font-size:21px}
#lh{position:absolute;bottom:18px;width:100%;text-align:center;font-size:14px;opacity:.85}
#pc{position:absolute;inset:0;background:#0007;backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;padding-top:104px;cursor:default}
#pc.on{opacity:1;pointer-events:auto}
#pc h3{font-size:20px;font-weight:500}
#dots{display:flex;gap:20px;margin:28px 0 54px}
#dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}
#dots i.f{background:#fff}
#dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
#keys{display:grid;grid-template-columns:repeat(3,78px);gap:18px 26px}
.k{width:78px;height:78px;border-radius:50%;background:#ffffff2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;line-height:1;transition:background .15s}
.k:active{background:#ffffff80}
.k small{font-size:10px;letter-spacing:2px;margin-top:3px;height:10px}
#pcx{position:absolute;right:50px;bottom:58px;font-size:17px}

/* 홈 */
#home{z-index:10}
#home .wp{position:absolute;inset:0;background-image:url(home.jpg)}
#grid{position:absolute;top:76px;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;padding:0 14px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-shadow:0 1px 4px #0008;cursor:pointer}
.ic i{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;font-size:32px;font-style:normal;box-shadow:0 2px 8px #0004;transition:transform .1s}
.ic:active i{transform:scale(.9)}
#dock{position:absolute;bottom:22px;left:14px;right:14px;height:94px;border-radius:36px;background:#ffffff38;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:flex;justify-content:space-around;align-items:center}
#dock .ic span{display:none}
.bd{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font:600 13px/22px system-ui;text-align:center;padding:0 6px}

/* 앱 공통 */
.app{position:absolute;inset:0;z-index:20;background:#fff;color:#000;overflow:hidden;border-radius:56px;opacity:0;transform:scale(.12);pointer-events:none;transition:transform .4s cubic-bezier(.3,.85,.3,1),opacity .25s,border-radius .4s}
.app.open{opacity:1;transform:scale(1);border-radius:0;pointer-events:auto}
.v{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:54px;background:#fff}
.lh{padding:14px 20px 8px;font-size:34px;font-weight:700}
.rows{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:12px;padding:10px 20px;position:relative;cursor:pointer}
.row>div{flex:1;min-width:0;border-bottom:.5px solid #0002;padding-bottom:10px}
.row p{font-size:14.5px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row small{position:absolute;right:20px;top:14px;color:#999;font-size:13px}
.row u{position:absolute;right:20px;bottom:20px;min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;text-decoration:none;font-size:12px;line-height:20px;text-align:center}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(#a7aab5,#7d808c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:600;flex:none;margin-bottom:10px}
.th{transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);box-shadow:-8px 0 20px #0002}
.app.t .th{transform:none}
.thh{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:.5px solid #0002;background:#f7f7f7}
.bk{font-size:34px;line-height:26px;color:#0a84ff;padding-bottom:4px}
.msgs{flex:1;overflow:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.r{display:flex;gap:8px;max-width:82%;align-items:flex-start}
.r.me{align-self:flex-end}
.r .av{width:36px;height:36px;font-size:15px;margin:0}
.n{font-size:12px;color:#444;display:block;margin-bottom:3px}
.b{padding:9px 14px;border-radius:19px;font-size:16.5px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.sms .me .b{background:#0a84ff;color:#fff}.sms .you .b{background:#e9e9eb}
.sms .row .av{background:linear-gradient(#a7aab5,#7d808c)}
.typ{letter-spacing:3px;color:#888}
.bar{display:flex;gap:8px;padding:8px 12px 34px;background:#f7f7f7;border-top:.5px solid #0002}
.bar input{flex:1;height:38px;border:1px solid #ccc;border-radius:19px;padding:0 14px;font-size:16px;outline:0;background:#fff;user-select:text;-webkit-user-select:text}
.bar button{width:38px;height:38px;border-radius:50%;background:#0a84ff;color:#fff;font-size:20px;font-weight:700}
.kko .lh{font-size:26px}
.kko .row .av{border-radius:18px;background:linear-gradient(#cfd6e0,#9aa5b6)}
.kko .thh{background:#b2c7d9;border:0}.kko .bk{color:#222}
.kko .msgs{background:#b2c7d9}
.kko .you .b{background:#fff;border-radius:4px 16px 16px 16px}
.kko .me .b{background:#fee500;border-radius:16px 4px 16px 16px}
.kko .bar{background:#fff}.kko .bar button{background:#fee500;color:#222}.kko .bar input{border-radius:8px}

/* 전화 */
#phoneapp .v{align-items:center;background:#fff}
#num{height:92px;margin-top:70px;font-size:40px;font-weight:300;display:flex;align-items:center;letter-spacing:1px}
#pad{display:grid;grid-template-columns:repeat(3,80px);gap:14px 24px}
#pad .k{width:80px;height:80px;background:#e9e9eb;color:#000}
#pad .k:active{background:#c9c9ce}
#pcrow{display:grid;grid-template-columns:repeat(3,80px);gap:24px;margin-top:16px;align-items:center;justify-items:center}
.cb{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#34c759;color:#fff}
.cb.red{background:#ff3b30}
#del{font-size:26px;color:#888}
#call{z-index:40;background:linear-gradient(#3a4252,#161a22);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;padding-top:120px;color:#fff}
#call.on{opacity:1;pointer-events:auto}
#cn{font-size:36px;font-weight:500;margin-top:14px}
#cs{font-size:18px;opacity:.7;margin-top:6px}
#cav{width:96px;height:96px;font-size:42px;margin:0}
#cb{position:absolute;bottom:90px;width:100%;display:flex;flex-direction:column;align-items:center;gap:44px}
.cr{display:flex;gap:52px}
.cs{width:72px;height:72px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:26px}
.cs.on{background:#fff;color:#000}
.cl{text-align:center;font-size:13px;margin-top:6px}

/* 알림, 토스트 */
#nt{position:absolute;z-index:80;top:56px;left:8px;right:8px;padding:12px 14px;border-radius:26px;background:#f2f2f2ee;backdrop-filter:blur(20px);color:#000;display:flex;gap:12px;align-items:center;transform:translateY(-160%);transition:transform .45s cubic-bezier(.3,.9,.3,1);box-shadow:0 8px 24px #0004;cursor:pointer}
#nt.on{transform:none}
#nt i{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:21px;background:#fee500;flex:none}
#nt b{font-size:15px}#nt p{font-size:14px;color:#333;margin-top:1px}
#toast{position:absolute;z-index:85;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:20px;background:#000b;font-size:14px;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="phone"><div id="side" title="잠금"></div>
<div id="screen">
  <div id="isl"></div>
  <div id="sb"><span id="st">9:41</span><span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2.3 0 4.4.9 6 2.4l1.1-1.1A10.4 10.4 0 0 0 8.5.7C5.8.7 3.3 1.7 1.4 3.5l1.1 1.1a8.8 8.8 0 0 1 6-2.4zm0 3.6c1.4 0 2.6.5 3.6 1.4l1.1-1.1a7.2 7.2 0 0 0-9.4 0l1.1 1.1c1-.9 2.2-1.4 3.6-1.4zm0 3.5l1.9 2-1.9 1-1.9-1z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="currentColor"/><path d="M24 4.5v4c1-.3 1.7-1.1 1.7-2s-.7-1.7-1.7-2z" fill="currentColor" opacity=".5"/></svg>
  </span></div>

  <div id="home" class="layer"><div class="wp"></div><div id="grid"></div><div id="dock"></div></div>

  <div id="call" class="layer"><i class="av" id="cav"></i><div id="cn"></div><div id="cs"></div><div id="cb"></div></div>

  <div id="lock" class="layer">
    <div class="wp"></div><div class="sh"></div>
    <div id="ld"></div><div id="lt"></div>
    <div class="lb" style="left:48px">🔦</div><div class="lb" style="right:48px">📷</div>
    <div id="lh">화면을 눌러 잠금 해제</div>
    <div id="pc"><h3>암호 입력</h3><div id="dots"><i></i><i></i><i></i><i></i></div><div id="keys"></div><button id="pcx">취소</button></div>
  </div>

  <div id="nt"></div><div id="toast"></div><div id="hi"></div>
</div></div></div>

<script>
const $=s=>document.querySelector(s),scr=$('#screen'),ph=$('#phone');
const PASS='0323';
let S=1,locked=true,curApp=null,pin='',callT=null,seeded=false;

/* 화면 크기에 맞춰 폰 크기 조절 */
function fit(){
  const w=innerWidth,h=innerHeight,m=w<=500;
  document.body.classList.toggle('m',m);
  const W=m?402:430,H=m?874:902;
  S=m?Math.min(w/W,h/H):Math.min((w-30)/W,(h-30)/H,1.1);
  ph.style.transform=`scale(${S})`;
}
addEventListener('resize',fit);fit();

/* 시계 */
function tick(){
  const d=new Date(),t=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  $('#st').textContent=t;$('#lt').textContent=t;
  $('#ld').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
}
tick();setInterval(tick,10000);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}

/* 잠금화면 / 암호 */
const keys=$('#keys'),dots=[...document.querySelectorAll('#dots i')];
const subs={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
[1,2,3,4,5,6,7,8,9,'',0,''].forEach(n=>{
  const b=document.createElement('button');
  if(n===''){keys.appendChild(document.createElement('span'));return}
  b.className='k';b.innerHTML=`${n}<small>${subs[n]||''}</small>`;b.onclick=e=>{e.stopPropagation();press(String(n))};keys.appendChild(b);
});
function showPC(){pin='';drawDots();$('#pc').classList.add('on')}
function hidePC(){$('#pc').classList.remove('on')}
function drawDots(){dots.forEach((d,i)=>d.classList.toggle('f',i<pin.length))}
function press(n){
  if(pin.length>=4)return;
  pin+=n;drawDots();
  if(pin.length<4)return;
  setTimeout(()=>{
    if(pin===PASS)unlock();
    else{const d=$('#dots');d.classList.add('shake');navigator.vibrate&&navigator.vibrate(200);
      setTimeout(()=>{d.classList.remove('shake');pin='';drawDots()},380)}
  },120);
}
$('#lock').onclick=()=>{if(!$('#pc').classList.contains('on'))showPC()};
$('#pcx').onclick=e=>{e.stopPropagation();hidePC()};
addEventListener('keydown',e=>{
  if(locked&&$('#pc').classList.contains('on')){
    if(/^\d$/.test(e.key))press(e.key);
    else if(e.key==='Backspace'){pin=pin.slice(0,-1);drawDots()}
    else if(e.key==='Escape')hidePC();
  }else if(locked&&(e.key==='Enter'||e.key===' ')&&!/INPUT/.test(document.activeElement.tagName)){showPC()}
});
function unlock(){
  locked=false;$('#lock').classList.add('gone');setTimeout(hidePC,500);
  if(!seeded){seeded=true;
    setTimeout(()=>kko.receive('민준','오늘 저녁에 치킨 콜? 🍗'),7000);
    setTimeout(()=>{if(!locked&&!$('#call').classList.contains('on'))callScreen('엄마','휴대전화',true)},60000);
  }
}
function lock(){
  if($('#call').classList.contains('on'))return;
  goHome();hideNt();locked=true;$('#lock').classList.remove('gone');tick();
}
$('#side').onclick=lock;

/* 홈 화면 */
const apps={};
const icons=[
 ['photos','사진','🌸','#fff'],['clock','시계','🕒','#111'],['weather','날씨','⛅','linear-gradient(#4aa3f5,#1e6fd9)'],['notes','메모','📝','#ffd84a'],
 ['maps','지도','🗺️','linear-gradient(#7ed67e,#3aa0e8)'],['settings','설정','⚙️','linear-gradient(#a5a5ab,#6e6e74)'],['calc','계산기','🧮','#ff9f0a'],['health','건강','❤️','#fff']];
const dockIcons=[['phoneapp','전화','📞','linear-gradient(#5cf26b,#16c336)'],['sms','메시지','💬','linear-gradient(#5cf26b,#16c336)'],['kko','톡',
 '<svg width="36" height="36" viewBox="0 0 24 24"><ellipse cx="12" cy="11" rx="9" ry="7.5" fill="#3b1e1e"/><path d="M7.5 16l-1 4.5 5-3z" fill="#3b1e1e"/></svg>','#fee500'],['camera','카메라','📷','linear-gradient(#d0d0d5,#8a8a90)']];
function mkIcon(a){
  const d=document.createElement('div');d.className='ic';d.dataset.id=a[0];
  d.innerHTML=`<i style="background:${a[3]}">${a[2]}</i><span>${a[1]}</span>`;d.onclick=()=>openApp(a[0],d.querySelector('i'));return d;
}
icons.forEach(a=>$('#grid').appendChild(mkIcon(a)));
dockIcons.forEach(a=>$('#dock').appendChild(mkIcon(a)));

function openApp(id,iconEl){
  if(!apps[id]){toast('아직 준비 중인 앱이에요');return}
  const el=apps[id],sr=scr.getBoundingClientRect(),r=iconEl.getBoundingClientRect();
  el.style.transformOrigin=`${(r.left+r.width/2-sr.left)/S}px ${(r.top+r.height/2-sr.top)/S}px`;
  if(curApp&&curApp!==el)curApp.classList.remove('open');
  curApp=el;el.classList.add('open');scr.classList.add('inapp');
  const b=$(`.ic[data-id=${id}] .bd`);if(b)b.remove();
}
function goHome(){
  if(curApp){curApp.classList.remove('open','t');curApp=null}
  scr.classList.remove('inapp');
}
$('#hi').onclick=()=>{if(locked)return;if(curApp)goHome()};

/* 알림 */
let ntT,ntFn;
function hideNt(){$('#nt').classList.remove('on')}
function notify(icon,title,text,fn){
  const n=$('#nt');n.innerHTML=`<i>${icon}</i><div><b>${title}</b><p>${text}</p></div>`;
  ntFn=fn;n.classList.add('on');clearTimeout(ntT);ntT=setTimeout(hideNt,5000);
}
$('#nt').onclick=()=>{hideNt();if(locked){showPC();return}ntFn&&ntFn()};

/* 채팅 앱 (메시지 / 톡 공용) */
function chatApp(id,kind,title,data){
  const el=document.createElement('div');el.className='app '+kind;el.id=id;
  el.innerHTML=`<div class="v"><div class="lh">${title}</div><div class="rows"></div></div>
  <div class="v th"><div class="thh"><button class="bk">‹</button><b class="nm"></b></div><div class="msgs"></div>
  <div class="bar"><input placeholder="${kind=='sms'?'iMessage':'메시지 입력'}"><button>↑</button></div></div>`;
  scr.appendChild(el);apps[id]=el;
  const rows=el.querySelector('.rows'),msgs=el.querySelector('.msgs'),inp=el.querySelector('input');
  let cur=null;
  const bub=(m,t)=>{const me=m[0]=='me',k=kind=='kko'&&!me;
    return `<div class="r ${me?'me':'you'}">${k?`<i class="av">${(m[2]||t.n)[0]}</i>`:''}<div>${k?`<span class="n">${m[2]||t.n}</span>`:''}<div class="b">${m[1]}</div></div></div>`};
  const list=()=>{rows.innerHTML=data.map((t,i)=>`<div class="row" data-i="${i}"><i class="av">${t.n[0]}</i><div><b>${t.n}</b><p>${t.m[t.m.length-1][1]}</p></div><small>${t.t}</small>${t.u?`<u>${t.u}</u>`:''}</div>`).join('')};
  const draw=()=>{msgs.innerHTML=cur.m.map(m=>bub(m,cur)).join('');msgs.scrollTop=1e6};
  const open=t=>{cur=t;t.u=0;el.querySelector('.nm').textContent=t.n;draw();el.classList.add('t')};
  rows.onclick=e=>{const r=e.target.closest('.row');if(r)open(data[r.dataset.i])};
  el.querySelector('.bk').onclick=()=>{el.classList.remove('t');cur=null;list()};
  function send(){
    const v=inp.value.trim();if(!v||!cur)return;
    const t=cur;t.m.push(['me',v]);inp.value='';draw();
    if(!t.r)return;
    setTimeout(()=>{if(cur===t){msgs.insertAdjacentHTML('beforeend','<div class="r you"><div class="b typ">•••</div></div>');msgs.scrollTop=1e6}},500);
    setTimeout(()=>{t.m.push(['them',t.r[Math.floor(Math.random()*t.r.length)],t.s&&t.s[Math.floor(Math.random()*t.s.length)]]);if(cur===t)draw();else list()},1800);
  }
  el.querySelector('.bar button').onclick=send;
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send()};
  list();
  return{receive(name,text){

/* 전화 앱 */
(function(){
  const el=document.createElement('div');el.className='app';el.id='phoneapp';
  el.innerHTML=`<div class="v"><div id="num"></div><div id="pad"></div><div id="pcrow"><span></span><button class="cb" id="dial">📞</button><button id="del">⌫</button></div></div>`;
  scr.appendChild(el);apps.phoneapp=el;
  const pad=el.querySelector('#pad'),num=el.querySelector('#num');let v='';
  ['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(n=>{
    const b=document.createElement('button');b.className='k';b.innerHTML=`${n}<small>${subs[n]||''}</small>`;
    b.onclick=()=>{if(v.length<15){v+=n;num.textContent=v}};pad.appendChild(b);
  });
  el.querySelector('#del').onclick=()=>{v=v.slice(0,-1);num.textContent=v};
  el.querySelector('#dial').onclick=()=>{if(v)callScreen(v,'휴대전화',false)};
})();

/* 통화 화면 */
function callScreen(name,sub,incoming){
  const c=$('#call');clearInterval(callT);
  $('#cav').textContent=/^[\d*#]/.test(name)?'👤':name[0];$('#cn').textContent=name;
  const cb=$('#cb');
  const end=()=>{clearInterval(callT);c.classList.remove('on');scr.classList.remove('incall');if(!curApp)scr.classList.remove('inapp')};
  const start=()=>{
    let s=0;$('#cs').textContent='00:00';
    callT=setInterval(()=>{s++;$('#cs').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
    cb.innerHTML=`<div class="cr">${['🔇|음소거','⌨️|키패드','🔊|스피커'].map(x=>`<div><div class="cs">${x.split('|')[0]}</div><div class="cl">${x.split('|')[1]}</div></div>`).join('')}</div><button class="cb red" style="transform:rotate(135deg)">📞</button>`;
    cb.querySelectorAll('.cs').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    cb.querySelector('.cb').onclick=end;
  };
  if(incoming){
    $('#cs').textContent='휴대전화 수신 중…';
    cb.innerHTML=`<div class="cr" style="gap:120px"><div><button class="cb red" style="transform:rotate(135deg)">📞</button><div class="cl">거절</div></div><div><button class="cb">📞</button><div class="cl">수락</div></div></div>`;
    const [no,yes]=cb.querySelectorAll('.cb');no.onclick=end;yes.onclick=start;
  }else{
    $('#cs').textContent='전화 거는 중…';
    cb.innerHTML=`<button class="cb red" style="transform:rotate(135deg)">📞</button>`;cb.querySelector('.cb').onclick=end;
    callT=setTimeout(start,1800);
  }
  scr.classList.add('incall');c.classList.add('on');
  if(incoming)hideNt();
}
