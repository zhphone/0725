<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>iPhone 17 시뮬레이터</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation;background:radial-gradient(circle at 50% 30%,#2b2e3b,#0b0c11);font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#phone{position:absolute;left:50%;top:50%;margin:-451px 0 0 -215px;width:430px;height:902px;padding:14px;border-radius:72px;background:linear-gradient(145deg,#8d8f96,#3b3d44 45%,#7a7c84);box-shadow:0 30px 80px #000a,inset 0 0 0 2px #ffffff30}
#side{position:absolute;right:-5px;top:250px;width:5px;height:96px;border-radius:0 3px 3px 0;background:#6b6d75;cursor:pointer}
#screen{position:relative;width:402px;height:874px;border-radius:58px;clip-path:inset(0 round 58px);overflow:hidden;background:#000;box-shadow:0 0 0 6px #000;color:#fff}
.layer{position:absolute;inset:0}
.wp{background-size:cover;background-position:center}
#isl{position:absolute;z-index:75;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
#sb{position:absolute;z-index:70;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 48px;font-weight:600;font-size:17px;transition:color .3s}
#sb .r{display:flex;gap:6px;align-items:center}
#screen.inapp #sb{color:#000}
#screen.incall #sb{color:#fff}
#hi{position:absolute;z-index:90;bottom:0;left:0;right:0;height:30px;cursor:pointer}
#hi::after{content:"";position:absolute;left:50%;bottom:8px;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:#fff;transition:background .3s}
#screen.inapp #hi::after{background:#000}
#screen.incall #hi::after{background:#fff}

/* 잠금화면 */
#lock{z-index:60;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
#lock.gone{transform:translateY(-102%);pointer-events:none}
#lock .wp{position:absolute;inset:0;background-image:url(lock.jpg)}
#lock .sh{position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#0000 65%,#0007)}
#ld{position:absolute;top:92px;width:100%;text-align:center;font-size:20px;font-weight:500;text-shadow:0 1px 8px #0006}
#lt{position:absolute;top:112px;width:100%;text-align:center;font-size:92px;font-weight:600;letter-spacing:-2px;text-shadow:0 2px 14px #0005}
.lb{position:absolute;bottom:50px;width:52px;height:52px;border-radius:50%;background:#2a2a2ca8;border:1px solid #ffffff22;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;place-items:center}
#lh{position:absolute;bottom:18px;width:100%;text-align:center;font-size:14px;opacity:.85}
#pc{position:absolute;inset:0;background:#0007;backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;padding-top:104px;cursor:default}
#pc.on{opacity:1;pointer-events:auto}
#pc h3{font-size:20px;font-weight:500}
#dots{display:flex;gap:20px;margin:28px 0 54px}
#dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}
#dots i.f{background:#fff}
#dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
#keys{display:grid;grid-template-columns:repeat(3,78px);gap:18px 26px}
.k{width:78px;height:78px;border-radius:50%;background:#ffffff2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;line-height:1;transition:background .15s}
.k:active{background:#ffffff80}
.k small{font-size:10px;letter-spacing:2px;margin-top:3px;height:10px}
#pcx{position:absolute;right:50px;bottom:58px;font-size:17px}

/* 홈 */
#home{z-index:10}
#home .wp{position:absolute;inset:0;background-image:url(home-new.jpg)}
#grid{position:absolute;top:78px;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;padding:0 17px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-shadow:0 1px 5px #000b,0 0 2px #0007;cursor:pointer}
.ic i{position:relative;display:block;width:60px;height:60px;transition:transform .1s}
.ic i img{width:60px;height:60px;display:block;pointer-events:none}
.ic:active i{transform:scale(.9)}
#dock{position:absolute;bottom:22px;left:14px;right:14px;height:100px;border-radius:38px;background:#ffffff30;border:1px solid #ffffff22;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:flex;justify-content:center;gap:26px;align-items:center}
#dock .ic span{display:none}
.bd{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font:600 13px/22px system-ui;text-align:center;padding:0 6px}

/* 앱 공통 */
.app{position:absolute;inset:0;z-index:20;background:#fff;color:#000;overflow:hidden;border-radius:56px;opacity:0;transform:scale(.12);pointer-events:none;transition:transform .4s cubic-bezier(.3,.85,.3,1),opacity .25s,border-radius .4s}
.app.open{opacity:1;transform:scale(1);border-radius:0;pointer-events:auto}
.v{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:54px;background:#fff}
.lh{padding:14px 20px 8px;font-size:34px;font-weight:700}
.rows{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:12px;padding:10px 20px;position:relative;cursor:pointer}
.row>div{flex:1;min-width:0;border-bottom:.5px solid #0002;padding-bottom:10px}
.row p{font-size:14.5px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row small{position:absolute;right:20px;top:14px;color:#999;font-size:13px}
.row u{position:absolute;right:20px;bottom:20px;min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;text-decoration:none;font-size:12px;line-height:20px;text-align:center}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(#a7aab5,#7d808c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:600;flex:none;margin-bottom:10px}
.th{transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);box-shadow:-8px 0 20px #0002}
.app.t .th{transform:none}
.thh{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:.5px solid #0002;background:#f7f7f7}
.bk{font-size:34px;line-height:26px;color:#0a84ff;padding-bottom:4px}
.msgs{flex:1;overflow:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.r{display:flex;gap:8px;max-width:82%;align-items:flex-start}
.r.me{align-self:flex-end}
.r .av{width:36px;height:36px;font-size:15px;margin:0}
.n{font-size:12px;color:#444;display:block;margin-bottom:3px}
.b{padding:9px 14px;border-radius:19px;font-size:16.5px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.sms .me .b{background:#0a84ff;color:#fff}.sms .you .b{background:#e9e9eb}
.sms .row .av{background:linear-gradient(#a7aab5,#7d808c)}
.typ{letter-spacing:3px;color:#888}
.bar{display:flex;gap:8px;padding:8px 12px 34px;background:#f7f7f7;border-top:.5px solid #0002}
.bar input{flex:1;height:38px;border:1px solid #ccc;border-radius:19px;padding:0 14px;font-size:16px;outline:0;background:#fff;user-select:text;-webkit-user-select:text}
.bar button{width:38px;height:38px;border-radius:50%;background:#0a84ff;color:#fff;font-size:20px;font-weight:700}

/* 전화 */
.cb{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#34c759;color:#fff}
.cb.red{background:#ff3b30}
#call{z-index:65;background:linear-gradient(#3a4252,#161a22);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;padding-top:120px;color:#fff}
#call.on{opacity:1;pointer-events:auto}
#cn{font-size:36px;font-weight:500;margin-top:14px}
#cs{font-size:18px;opacity:.7;margin-top:6px}
#cav{width:96px;height:96px;font-size:42px;margin:0}
#cb{position:absolute;bottom:90px;width:100%;display:flex;flex-direction:column;align-items:center;gap:44px}
.cr{display:flex;gap:52px}
.cs{width:72px;height:72px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:26px}
.cs.on{background:#fff;color:#000}
.cl{text-align:center;font-size:13px;margin-top:6px}

/* 알림, 토스트 */
#nt{position:absolute;z-index:80;top:56px;left:8px;right:8px;padding:12px 14px;border-radius:26px;background:#f2f2f2ee;backdrop-filter:blur(20px);color:#000;display:flex;gap:12px;align-items:center;transform:translateY(-260px);opacity:0;transition:transform .45s cubic-bezier(.3,.9,.3,1),opacity .2s;box-shadow:0 8px 24px #0004;cursor:pointer}
#nt.on{transform:none;opacity:1}
#nt i{width:38px;height:38px;display:block;font-style:normal;font-size:24px;flex:none}#nt i img{width:38px;height:38px;border-radius:9px;display:block}
#nt b{font-size:15px}#nt p{font-size:14px;color:#333;margin-top:1px}
#toast{position:absolute;z-index:85;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:20px;background:#000b;font-size:14px;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}

#screen.inview #sb{color:#fff}#screen.inview #hi::after{background:#fff}
.pg{padding-top:0}
.pgh{padding:58px 20px 8px;display:flex;align-items:baseline;justify-content:space-between;background:#fff}
.pgh b{font-size:34px;font-weight:700}.pgh small{font-size:14px;color:#8e8e93}
.pgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start;padding-bottom:120px}
.pi{aspect-ratio:1;background-image:url(thumbs.jpg);background-color:#e5e5ea;cursor:pointer}
.pi:active{opacity:.7}
.pseg{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;padding:4px;border-radius:24px;background:#f2f2f7e6;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 14px #0003;font-size:14px;color:#555}
.pseg span,.pseg b{padding:8px 15px;border-radius:20px;font-weight:500;white-space:nowrap}
.pseg b{background:#fff;color:#000;box-shadow:0 1px 4px #0002}
.pv{position:absolute;inset:0;background:#fff;color:#111;opacity:0;pointer-events:none;transition:opacity .25s,background .25s}
.app.t .pv{opacity:1;pointer-events:auto}
.pv.bare{background:#000}
.pvs{position:absolute;left:0;right:0;top:104px;bottom:150px;overflow:hidden;touch-action:pan-y;cursor:grab;transition:top .25s,bottom .25s}
.pv.bare .pvs{top:0;bottom:0}
.pvtr{display:flex;height:100%;will-change:transform}
.sl{width:402px;height:100%;flex:none;display:grid;place-items:center}
.sl img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.pv svg{display:block;width:22px;height:22px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pvh,.pvf,.pvlk{position:absolute;left:0;right:0;transition:opacity .2s}
.pvh{top:0;padding:56px 14px 0;display:flex;align-items:center;justify-content:space-between}
.cbtn{width:41px;height:41px;border-radius:50%;background:#fafafa;border:1px solid #d8d8dc;box-shadow:0 6px 14px -6px #0003;display:grid;place-items:center;flex:none;padding:0}
.pvpill,.pvpill2{border-radius:22px;background:#fafafa;border:1px solid #d8d8dc;box-shadow:0 6px 14px -6px #0003}
.pvpill{height:41px;padding:0 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.pvt{font-size:15px;font-weight:600;color:#111}
.pvtm{font-size:12px;font-weight:500;color:#111}
.pvlk{top:118px;left:auto;right:14px;display:flex;align-items:center;gap:2px;height:18px;padding:0 6px 0 5px;border-radius:9px;background:#fafafa;border:1px solid #d8d8dc}
.pvlk svg{width:12px;height:12px}
.pvf{bottom:0;padding:0 14px 34px}
.pvstrip{height:28px;margin-bottom:17px;display:flex;justify-content:center;align-items:center;gap:2px;overflow:hidden}
.st,.sx{display:block;height:28px;width:21px;flex:none;border-radius:3px}
.st{background-image:url(thumbs.jpg);background-color:#e5e5ea;cursor:pointer}
.st.cur{border-radius:4px}
.pvbar{display:flex;align-items:center;justify-content:space-between}
.pvbar .cbtn{width:44px;height:44px}
.pvpill2{height:44px;padding:0 8px;display:flex;align-items:center;gap:6px}
.pvpill2 button{width:40px;height:40px;display:grid;place-items:center}
.pv.bare .pvh,.pv.bare .pvf,.pv.bare .pvlk{opacity:0;pointer-events:none}
.hrt.on svg{fill:#ff3b30;stroke:#ff3b30}

#sb .r{gap:7px}
#phoneapp{background:#fff}
.pkv{position:absolute;inset:0;display:none;flex-direction:column;padding-top:54px}.pkv.on{display:flex}
#pknum{flex:1;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:16px}
#pkn{font-size:40px;font-weight:300;height:48px;letter-spacing:1px}
#pkadd{font-size:15px;color:#2f7df6;height:20px;visibility:hidden}
#pkx{height:46px;width:100%;display:flex;justify-content:center}
#pksg{display:none;flex-direction:column;align-items:center;line-height:1.3}
#pksg .nm{font-size:16px;font-weight:600;color:#000}
#pksg .sb{font-size:13px;color:#8e8e93}
#pksg .sb b{color:#000;font-weight:700}
.pkg,.pkc{display:grid;grid-template-columns:repeat(3,var(--kb,80px));justify-content:center}
.pkg{gap:var(--kg,16px) 20px}
.pkk{width:var(--kb,80px);height:var(--kb,80px);border-radius:50%;background:radial-gradient(circle at 50% 22%,#fff,#f2f2f3);border:1px solid #d3d3d7;box-shadow:0 10px 18px -8px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:300;line-height:1;color:#000;transition:background .12s}
.pkk:active{background:#dcdce0}
.pkk small{font-size:11px;font-weight:700;letter-spacing:3px;margin-top:2px;height:11px;line-height:11px}
.pkc{gap:20px;margin:22px 0 112px;align-items:center;justify-items:center}
.pkcall{grid-column:2;width:var(--kb,80px);height:var(--kb,80px);border-radius:50%;background:linear-gradient(#74d77c,#5cc765);border:1px solid #8fe096;display:grid;place-items:center;box-shadow:0 8px 16px -6px #34c75988}
.pkdel{font-size:28px;color:#8e8e93;visibility:hidden}
.ptabs{position:absolute;z-index:5;left:18px;right:18px;bottom:20px;height:58px;border-radius:30px;background:#fafafaea;border:1px solid #0000001c;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 24px -6px #0003;display:flex;padding:4px}
.pt{flex:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:#000;cursor:pointer}
.pt svg{width:26px;height:24px}.pt.on{background:#e9e9ec;color:#2f7df6}
.rch{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0}
.rbtn{height:40px;min-width:40px;padding:0 18px;border-radius:20px;background:#fafafa;border:1px solid #d8d8dc;box-shadow:0 6px 14px -6px #0003;display:grid;place-items:center;font-size:16px;color:#000}
.rseg{display:flex;padding:3px;border-radius:24px;border:1px solid #d8d8dc;box-shadow:0 6px 14px -6px #0003;font-size:16px}
.rseg span{padding:9px 18px;border-radius:21px;cursor:pointer}.rseg span.on{background:#e9e9ec}
.rtitle{font-size:34px;font-weight:700;padding:12px 18px 6px;color:#000}
#rlist{flex:1;overflow:auto;padding-bottom:110px}
.rr{display:flex;align-items:center;gap:12px;padding-left:18px;height:67px;color:#000}
.rav{width:40px;height:40px;border-radius:50%;background:linear-gradient(#9aa6dc,#6b72b1);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:600;font-style:normal;flex:none}
.rav.gen{background:linear-gradient(#bcbec8,#9b9da9)}
.rm{flex:1;min-width:0;height:100%;display:flex;align-items:center;border-bottom:.5px solid #cfcfd4;padding-right:16px}
.rtx{flex:1;min-width:0}.rtx b{display:block;font-size:17px;font-weight:500}
.rtx p{font-size:14.5px;color:#8e8e93;display:flex;align-items:center;gap:4px;margin-top:2px}
.rtm{font-size:15px;color:#8e8e93;margin:0 10px 0 8px;white-space:nowrap}
.ri{width:36px;height:36px;border-radius:50%;background:#f0f0f3;color:#2f7df6;display:grid;place-items:center;font:italic 600 19px Georgia,serif}
.rr.miss b{color:#ff3b30}

/* 카카오톡 */
.kh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.kh b{font-size:24px;font-weight:700;color:#111;letter-spacing:-.5px}
.kh div{display:flex;gap:19px;align-items:center}

.krows{flex:1;overflow:auto;padding:10px 0 96px}
.kr1{display:flex;align-items:center;gap:13px;padding:0 16px;height:68px}

.dp{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;background:linear-gradient(#bcd5fb,#86aef2)}

.dp.d3{background:linear-gradient(#d3cdf8,#a094ec)}
.kx{flex:1;min-width:0}
.kn{display:flex;align-items:center;gap:6px;font-size:16.5px;font-weight:500;color:#111}
.kn em{font-style:normal;font-size:15px;font-weight:400;color:#9c9ca2}

.kx p{margin-top:3px;min-height:19px;font-size:14px;color:#85858b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ky{flex:none;height:46px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;padding-left:4px}
.ky small{font-size:12px;color:#9c9ca2;min-height:15px}
.ky u,.ktab u{min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:#f1592a;color:#fff;font:700 13px/22px system-ui,sans-serif;text-decoration:none;text-align:center}
.ktab{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;border-top:.5px solid #0001;display:flex;justify-content:space-around;padding:10px 6px 0}
.ktab i{position:relative;width:52px;height:38px;display:grid;place-items:center;color:#b4b4b9;font-style:normal}
.ktab i.on{color:#2b2b2e}
.ktab svg{width:30px;height:30px;fill:currentColor;display:block}
.ktab u{position:absolute;top:-4px;left:25px;display:none}
.kro{background:#abc0d2;transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);box-shadow:-8px 0 20px #0002}

.krh b{position:absolute;left:0;right:0;text-align:center;font-size:19px;font-weight:700;color:#111;pointer-events:none}

.kpl.kbk{gap:6px;padding:0 17px 0 10px;font-size:19px;font-weight:600;color:#111;cursor:pointer}

.kms>*{flex:none}

.mr.me{justify-content:flex-end}
.mav{width:36px;height:36px;border-radius:14px;flex:none;background-size:cover;background-position:center}
.mav.sp{background:none}
.mc{display:flex;flex-direction:column;min-width:0}
.mn{font-size:12.5px;color:#26323d;margin:1px 0 4px 1px}
.mb{display:flex;align-items:flex-end;gap:6px}
.mb time{font-size:11px;color:#3d4a57;white-space:nowrap;padding-bottom:1px}
.bub{position:relative;max-width:250px;padding:8px 13px;border-radius:16px;font-size:15.5px;line-height:1.35;color:#111;word-break:keep-all;overflow-wrap:anywhere;background:#fff}
.mr.me .bub{background:#fee500}
.mr.you.first .bub{border-top-left-radius:3px}
.mr.me.first .bub{border-top-right-radius:3px}
.mr.first .bub::before{content:"";position:absolute;top:0;width:10px;height:10px;background:inherit}
.mr.you.first .bub::before{left:-6px;clip-path:polygon(0 0,100% 0,100% 100%)}
.mr.me.first .bub::before{right:-6px;clip-path:polygon(0 0,100% 0,0 100%)}
.kib{position:absolute;left:10px;right:10px;bottom:28px;height:48px;border-radius:24px;display:flex;align-items:center;gap:8px;padding:0 5px 0 6px;background:#e9f1f8d0;border:1px solid #ffffffd0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 2px 10px #3a5a7a2a}
.kpb{width:34px;height:34px;display:grid;place-items:center;flex:none}
.kib input{flex:1;min-width:0;height:100%;border:0;background:none;font-size:16px;outline:0;color:#111;user-select:text;-webkit-user-select:text}
.kib input::placeholder{color:#9aa4ad}
.ke{width:24px;height:24px;border-radius:50%;background:#c3c9cf;display:grid;place-items:center;flex:none}
.kc{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;font-size:21px;font-weight:600;color:#111}
.kc.sd{display:none;background:#fee500}
.kib.has .wv{display:none}.kib.has .sd{display:grid}

/* 카톡 목록 상단 아이콘 */
.kh svg{width:26px;height:26px;stroke-width:2.2}
.kh div{gap:20px}
.pm{box-shadow:inset 0 0 0 .5px #00000018}
.kav.g3>:first-child{grid-column:1/3;width:50%;justify-self:center}
/* 자체 입력창 */
.kin{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:center;font-size:16px;color:#111;overflow:hidden;white-space:nowrap;cursor:text}
.kt{white-space:pre;flex:none}
.kph{color:#9aa4ad;flex:none}
.kib.has .kph{display:none}
.kcr{display:none;flex:none;width:2px;height:21px;border-radius:1px;background:#0a84ff;margin-left:1px;animation:kbl 1s steps(1) infinite}
.kro.kb .kcr{display:block}
@keyframes kbl{50%{opacity:0}}
.kib{transition:bottom .28s cubic-bezier(.3,.8,.3,1)}
.kro.kb .kib{bottom:294px}
.kro.kb .kib .wv{display:none}
.kro.kb .kms{padding-bottom:356px}
/* 자체 키보드 */
.kbd{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.8,.3,1);box-shadow:0 -.5px 0 #0000001a}
.kro.kb .kbd{transform:none}
.kbt{height:42px;display:flex;align-items:center;gap:24px;padding:0 16px;font-size:14px;color:#3a3a3e}
.kbt span{display:flex;align-items:center;gap:6px}
.kbt svg{width:20px;height:20px;fill:none;stroke:#3a3a3e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kbt .mo{margin-left:auto}
.kbt .mo svg{fill:#3a3a3e;stroke:none}
.kbp{background:#e1e2e9;border-radius:26px 26px 0 0;padding:14px 6px 34px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 #fffc}
.kkr{display:flex;justify-content:center;gap:5.5px}
.kkr.s3{justify-content:space-between}
.kkey{height:41px;min-width:34px;border-radius:9px;background:#fff;box-shadow:0 1px 0 #0001;font-size:21px;color:#111;display:grid;place-items:center;flex:none;position:relative;transition:background .08s}
.kkey:active{background:#cfd1da}
.kkey svg{width:24px;height:24px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kkey.w{width:46px}
.kkey.bw{width:44px}
.kkey.sm{font-size:16px;font-weight:500}
.kkey.on{background:#111}
.kkey.on svg{stroke:#fff}
.kkey.spc{flex:1}
.kkey.spc small{position:absolute;right:10px;bottom:5px;font-size:12px;color:#aaaeb8}
.kkey.ent{width:93px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>

const $=s=>document.querySelector(s),scr=$('#screen'),ph=$('#phone');
const PASS='0323';
let S=1,locked=true,curApp=null,pin='',callT=null,seeded=false;

/* 화면 크기에 맞춰 폰 크기 조절 (모바일은 화면을 가득 채움) */
function fit(){
  const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;
  S=Math.min((w-16)/430,(h-16)/902,1.1);
  ph.style.transform=`scale(${S})`;
}
addEventListener('resize',fit);window.visualViewport&&visualViewport.addEventListener('resize',fit);fit();

/* 시계 */
function tick(){
  const d=new Date(),t=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  $('#st').textContent=t;$('#lt').textContent=t;
  $('#ld').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
}
tick();setInterval(tick,10000);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}

/* 잠금화면 / 암호 */
const keys=$('#keys'),dots=[...document.querySelectorAll('#dots i')];
const subs={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
[1,2,3,4,5,6,7,8,9,'',0,''].forEach(n=>{
  const b=document.createElement('button');
  if(n===''){keys.appendChild(document.createElement('span'));return}
  b.className='k';b.innerHTML=`${n}<small>${subs[n]||''}</small>`;b.onclick=e=>{e.stopPropagation();press(String(n))};keys.appendChild(b);
});
function showPC(){pin='';drawDots();$('#pc').classList.add('on')}
function hidePC(){$('#pc').classList.remove('on')}
function drawDots(){dots.forEach((d,i)=>d.classList.toggle('f',i<pin.length))}
function press(n){
  if(pin.length>=4)return;
  pin+=n;drawDots();
  if(pin.length<4)return;
  setTimeout(()=>{
    if(pin===PASS)unlock();
    else{const d=$('#dots');d.classList.add('shake');navigator.vibrate&&navigator.vibrate(200);
      setTimeout(()=>{d.classList.remove('shake');pin='';drawDots()},380)}
  },120);
}
$('#lock').onclick=()=>{if(!$('#pc').classList.contains('on'))showPC()};
$('#pcx').onclick=e=>{e.stopPropagation();hidePC()};
addEventListener('keydown',e=>{
  if(locked&&$('#pc').classList.contains('on')){
    if(/^\d$/.test(e.key))press(e.key);
    else if(e.key==='Backspace'){pin=pin.slice(0,-1);drawDots()}
    else if(e.key==='Escape')hidePC();
  }else if(locked&&(e.key==='Enter'||e.key===' ')&&!/INPUT/.test(document.activeElement.tagName)){showPC()}
});
function unlock(){
  locked=false;$('#lock').classList.add('gone');setTimeout(hidePC,500);
  if(!seeded){seeded=true;
    setTimeout(()=>kk.receive('형~~'),7000);
    setTimeout(()=>kk.receive('짱하오'),12000);
  }
}
function lock(){
  if($('#call').classList.contains('on'))return;
  goHome();hideNt();locked=true;$('#lock').classList.remove('gone');tick();
}
$('#side').onclick=lock;

/* 홈 화면 */
const apps={};
const icons=[['facetime','FaceTime'],['notes','메모'],['photos','사진'],['camera','카메라'],['mail','Mail'],['music','음악'],['papago','Papago'],['wechat','WeChat']];
const dockIcons=[['phoneapp','전화','phone'],['safari','Safari'],['kko','톡']];
function mkIcon(a){
  const d=document.createElement('div');d.className='ic';d.dataset.id=a[0];
  d.innerHTML=`<i><img src="${IC[a[2]||a[0]]}" alt=""></i><span>${a[1]}</span>`;d.onclick=()=>openApp(a[0],d.querySelector('i'));return d;
}
icons.forEach(a=>$('#grid').appendChild(mkIcon(a)));
dockIcons.forEach(a=>$('#dock').appendChild(mkIcon(a)));

function openApp(id,iconEl){
  if(!apps[id]){toast('아직 준비 중인 앱이에요');return}
  const el=apps[id],sr=scr.getBoundingClientRect(),r=iconEl.getBoundingClientRect();
  el.style.transformOrigin=`${(r.left+r.width/2-sr.left)/S}px ${(r.top+r.height/2-sr.top)/S}px`;
  if(curApp&&curApp!==el){curApp.classList.remove('open');scr.classList.remove('inview')}
  curApp=el;el.classList.add('open');scr.classList.add('inapp');el.onopen&&el.onopen();
  const b=$(`.ic[data-id=${id}] .bd`);if(b)b.remove();
}
function goHome(){
  if(curApp){curApp.classList.remove('open','t');curApp=null}
  scr.classList.remove('inapp','inview');
}
$('#hi').onclick=()=>{if(locked)return;if(curApp)goHome()};

/* 알림 */
let ntT,ntFn;
function hideNt(){$('#nt').classList.remove('on')}
function notify(icon,title,text,fn){
  const n=$('#nt');n.innerHTML=`<i>${icon}</i><div><b>${title}</b><p>${text}</p></div>`;
  ntFn=fn;n.classList.add('on');clearTimeout(ntT);ntT=setTimeout(hideNt,5000);
}
$('#nt').onclick=()=>{hideNt();if(locked){showPC();return}ntFn&&ntFn()};

/* 채팅 앱 (메시지 / 톡 공용) */
function chatApp(id,kind,title,data){
  const el=document.createElement('div');el.className='app '+kind;el.id=id;
  el.innerHTML=`<div class="v"><div class="lh">${title}</div><div class="rows"></div></div>
  <div class="v th"><div class="thh"><button class="bk">‹</button><b class="nm"></b></div><div class="msgs"></div>
  <div class="bar"><input placeholder="${kind=='sms'?'iMessage':'메시지 입력'}"><button>↑</button></div></div>`;
  scr.appendChild(el);apps[id]=el;
  const rows=el.querySelector('.rows'),msgs=el.querySelector('.msgs'),inp=el.querySelector('input');
  let cur=null;
  const bub=(m,t)=>{const me=m[0]=='me',k=kind=='kko'&&!me;
    return `<div class="r ${me?'me':'you'}">${k?`<i class="av">${(m[2]||t.n)[0]}</i>`:''}<div>${k?`<span class="n">${m[2]||t.n}</span>`:''}<div class="b">${m[1]}</div></div></div>`};
  const list=()=>{rows.innerHTML=data.map((t,i)=>`<div class="row" data-i="${i}"><i class="av">${t.n[0]}</i><div><b>${t.n}</b><p>${t.m[t.m.length-1][1]}</p></div><small>${t.t}</small>${t.u?`<u>${t.u}</u>`:''}</div>`).join('')};
  const draw=()=>{msgs.innerHTML=cur.m.map(m=>bub(m,cur)).join('');msgs.scrollTop=1e6};
  const open=t=>{cur=t;t.u=0;el.querySelector('.nm').textContent=t.n;draw();el.classList.add('t')};
  rows.onclick=e=>{const r=e.target.closest('.row');if(r)open(data[r.dataset.i])};
  el.querySelector('.bk').onclick=()=>{el.classList.remove('t');cur=null;list()};
  function send(){
    const v=inp.value.trim();if(!v||!cur)return;
    const t=cur;t.m.push(['me',v]);inp.value='';draw();
    if(!t.r)return;
    setTimeout(()=>{if(cur===t){msgs.insertAdjacentHTML('beforeend','<div class="r you"><div class="b typ">•••</div></div>');msgs.scrollTop=1e6}},500);
    setTimeout(()=>{t.m.push(['them',t.r[Math.floor(Math.random()*t.r.length)],t.s&&t.s[Math.floor(Math.random()*t.s.length)]]);if(cur===t)draw();else list()},1800);
  }
  el.querySelector('.bar button').onclick=send;
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send()};
  list();
  return{receive(name,text){
    const t=data.find(x=>x.n==name);t.m.push(['them',text]);t.t='방금';
    const inThread=curApp===el&&cur===t;
    if(inThread)draw();else{t.u=(t.u||0)+1;if(!el.classList.contains('t'))list();
      const ic=$(`.ic[data-id=${id}] i`);if(ic&&!ic.querySelector('.bd')){ic.insertAdjacentHTML('beforeend','<span class="bd">1</span>')}}
    if(!inThread)notify(kind=='kko'?`<img src="${IC.kko}" alt="">`:'💬',name,text,()=>{openApp(id,$(`.ic[data-id=${id}] i`));open(t)});
  }};
}

  const kroEl=el.querySelector('.kro'),kbd=document.createElement('div'),kt=el.querySelector('.kt'),kin=el.querySelector('.kin');
  kbd.className='kbd';kroEl.appendChild(kbd);
  const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const VC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
  const FC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
  const pairOf=(M,ch)=>Object.keys(M).find(k=>M[k]===ch);
  let buf='',hc=null,hv=null,hf=null,lang='ko',mode='abc',shift=false;
  function comp(){
    if(hc&&hv)return String.fromCharCode(0xAC00+(CHO.indexOf(hc)*21+JUNG.indexOf(hv))*28+JONG.indexOf(hf||''));
    return hc||hv||'';
  }
  function commit(){buf+=comp();hc=hv=hf=null}
  function hangul(j){
    if(JUNG.includes(j)){
      if(hc&&hv&&hf){
        const p=pairOf(FC,hf);
        if(p){hf=p[0];commit();hc=p[1];hv=j}
        else{const m=hf;hf=null;commit();hc=m;hv=j}
      }else if(hv){
        const c=VC[hv+j];
        if(c)hv=c;else{commit();hv=j}
      }else hv=j;
    }else{
      if(hc&&hv){
        if(!hf){
          if(JONG.includes(j))hf=j;else{commit();hc=j}
        }else{
          const c=FC[hf+j];
          if(c)hf=c;else{commit();hc=j}
        }
      }else{commit();hc=j}

  }
  function bs(){
    if(hf){const p=pairOf(FC,hf);hf=p?p[0]:null}
    else if(hv){const p=pairOf(VC,hv);hv=p?p[0]:null}
    else if(hc)hc=null;

  const KOS={'ㅂ':'ㅃ','ㅈ':'ㅉ','ㄷ':'ㄸ','ㄱ':'ㄲ','ㅅ':'ㅆ','ㅐ':'ㅒ','ㅔ':'ㅖ'};
  const EN=['qwertyuiop','asdfghjkl','zxcvbnm'].map(r=>[...r]);

  const KI={

    bs:'<svg viewBox="0 0 24 24"><path d="M9 5h11a1.500 1.500 0 0 1 1.500 1.500v11A1.500 1.500 0 0 1 20 19H9L2.500 12z"/><path d="M12.500 9.500l5 5m0-5l-5 5"/></svg>',
    ent:'<svg viewBox="0 0 24 24"><path d="M20 6v6a2 2 0 0 1-2 2H5m0 0l4-4m-4 4l4 4"/></svg>',
    emo:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.500" fill="#111" stroke="none"/><circle cx="8.800" cy="10" r="1.300" fill="#fff" stroke="none"/><circle cx="15.200" cy="10" r="1.300" fill="#fff" stroke="none"/><path d="M7.200 13.600q4.800 5 9.600 0" stroke="#fff" stroke-width="1.800" fill="none"/></svg>'

      h='<div class="kkr">'+keys(NUM[0])+'</div><div class="kkr">'+keys(NUM[1])+'</div>'+
        '<div class="kkr s3"><span class="kkey w" style="visibility:hidden"></span><div class="kkr">'+keys(NUM[2])+'</div>'+k('bs','',KI.bs,'w')+'</div>';
    }else{
      const L=base.map(r=>r.map(lab));
      h='<div class="kkr">'+keys(L[0])+'</div><div class="kkr">'+keys(L[1])+'</div>'+
        '<div class="kkr s3">'+k('shift','',KI.sh,'w'+(shift?' on':''))+'<div class="kkr">'+keys(L[2])+'</div>'+k('bs','',KI.bs,'w')+'</div>';
    }
    h+='<div class="kkr">'+k(mode==='num'?'abc':'num','',mode==='num'?(lang==='ko'?'가나다':'ABC'):'123','sm bw')+
      k('lang','',KI.emo,'bw')+'<button class="kkey spc" data-a="sp"><small>'+(lang==='ko'?'한':'EN')+'</small></button>'+k('ent','',KI.ent,'ent')+'</div>';
    kbd.innerHTML=TB+'<div class="kbp">'+h+'</div>';
  }
  function act(a,k){
    if(a==='ch'){
      if(lang==='ko'&&mode==='abc'&&/[ㄱ-ㅣ]/.test(k))hangul(k);else{commit();buf+=k}
      if(shift){shift=false;render()}
    }else if(a==='bs')bs();
    else if(a==='sp'){commit();buf+=' '}
    else if(a==='ent'){send();return}
    else if(a==='shift'){shift=!shift;render();return}
    else if(a==='num'){commit();mode='num';shift=false;render()}
    else if(a==='abc'){commit();mode='abc';render()}
    else if(a==='lang'){commit();lang=lang==='ko'?'en':'ko';shift=false;mode='abc';render()}

  }
  function openKb(){

  const KMAP={q:'ㅂ',w:'ㅈ',e:'ㄷ',r:'ㄱ',t:'ㅅ',y:'ㅛ',u:'ㅕ',i:'ㅑ',o:'ㅐ',p:'ㅔ',a:'ㅁ',s:'ㄴ',d:'ㅇ',f:'ㄹ',g:'ㅎ',h:'ㅗ',j:'ㅓ',k:'ㅏ',l:'ㅣ',z:'ㅋ',x:'ㅌ',c:'ㅊ',v:'ㅍ',b:'ㅠ',n:'ㅜ',m:'ㅡ'};
  addEventListener('keydown',e=>{
    if(!(curApp===el&&kroEl.classList.contains('kb')&&el.classList.contains('t')))return;
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const k=e.key;

    if(k==='Escape'){closeKb();return}

    let c=k;
    if(lang==='ko'&&KMAP[k.toLowerCase()]){c=KMAP[k.toLowerCase()];if(k!==k.toLowerCase()&&KOS[c])c=KOS[c]}

  const stripEl=el.querySelector('.pvstrip'),CS=28;
  function meta(){
    const n=PH[idx],y=2000+ +n.slice(0,2),mo=+n.slice(2,4),dd=+n.slice(4,6),t=new Date();

/* 통화 화면 */
function callScreen(name,sub,incoming){
  const c=$('#call'),cb=$('#cb');clearInterval(callT);
  $('#cav').textContent=/^[\d*#]/.test(name)?'👤':name[0];$('#cn').textContent=name;
  let answered=!incoming,ended=false;
  const end=()=>{if(ended)return;ended=true;clearInterval(callT);c.classList.remove('on');scr.classList.remove('incall');
    addRecent(name,incoming?(answered?'in':'miss'):'out')};
  const start=()=>{
    answered=true;let n=0;$('#cs').textContent='00:00';
    callT=setInterval(()=>{n++;$('#cs').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')},1000);
    cb.innerHTML=`<div class="cr">${['🔇|음소거','⌨️|키패드','🔊|스피커'].map(x=>`<div><div class="cs">${x.split('|')[0]}</div><div class="cl">${x.split('|')[1]}</div></div>`).join('')}</div><button class="cb red" style="transform:rotate(135deg)">📞</button>`;
    cb.querySelectorAll('.cs').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    cb.querySelector('.cb').onclick=end;
  };
  if(incoming){
    $('#cs').textContent='휴대전화 수신 중…';
    cb.innerHTML=`<div class="cr" style="gap:120px"><div><button class="cb red" style="transform:rotate(135deg)">📞</button><div class="cl">거절</div></div><div><button class="cb">📞</button><div class="cl">수락</div></div></div>`;
    const [no,yes]=cb.querySelectorAll('.cb');no.onclick=end;yes.onclick=start;
  }else{
    $('#cs').textContent='전화 거는 중…';
    cb.innerHTML=`<button class="cb red" style="transform:rotate(135deg)">📞</button>`;cb.querySelector('.cb').onclick=end;
    callT=setTimeout(start,1800);
  }
  scr.classList.add('incall');c.classList.add('on');
  if(incoming)hideNt();
}

function ring(){if($('#call').classList.contains('on'))return setTimeout(ring,4000);callScreen('宝贝','휴대전화',true)}
